# nixpacks.toml

[phases.setup]
nixPkgs = ["python312", "chromium"]

[phases.install]
cmds = [
    "python3 -m venv /opt/venv",
    # Activate the venv and run all commands in the same shell
    "source /opt/venv/bin/activate && pip install -r requirements.txt && python -m playwright install --with-deps"
]

[start]
cmd = "/opt/venv/bin/gunicorn -w 4 -k uvicorn.workers.UvicornWorker api.main:app"
