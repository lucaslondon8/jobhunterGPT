[phases.setup]
aptPkgs = [
    "python3-pip",
    "wget",
    "ca-certificates",
    "fonts-liberation",
    "libasound2t64",
    "libatk-bridge2.0-0",
    "libdrm2",
    "libxkbcommon0",
    "libxcomposite1",
    "libxdamage1",
    "libxrandr2",
    "libgbm1",
    "libxss1",
    "libnss3",
    "libglib2.0-0",
    "libnspr4",
    "libatk1.0-0",
    "libcups2",
    "libdbus-1-3",
    "libxfixes3",
    "libpango-1.0-0",
    "libcairo2"
]

[phases.install]
cmds = [
    "python3 -m pip install -r requirements.txt",
    "python3 -m playwright install --with-deps chromium"
]

[start]
cmd = "python3 -m uvicorn api.main:app --host 0.0.0.0 --port $PORT"

