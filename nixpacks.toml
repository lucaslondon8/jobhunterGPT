# nixpacks.toml

[phases.setup]
# Ask the Nix package manager to provide pip, a browser, and other libraries.
nixPkgs = [
    "python312Packages.pip",
    "chromium",
    "ffmpeg"
]

[phases.install]
# First install python packages, then tell playwright to find the browser.
cmds = [
    "pip install -r requirements.txt",
    "playwright install --with-deps"
]

[start]
# Tell Railway how to start your web server.
# IMPORTANT: I see you have api/main.py. Your start command should be:
cmd = "gunicorn -w 4 -k uvicorn.workers.UvicornWorker api.main:app"
