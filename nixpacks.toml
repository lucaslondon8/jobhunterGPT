# nixpacks.toml

[phases.setup]
# Ask the Nix package manager to provide Python's package installer (pip).
# This is the correct way for a Nix environment.
nixPkgs = ["python312Packages.pip"]

[phases.install]
# Now that pip is guaranteed to be here, this command should work.
cmds = ["pip install -r requirements.txt"]

[start]
# Make sure to change app:app if your file is named main.py (e.g., main:app)
# or if your Flask/FastAPI variable is named differently.
cmd = "gunicorn app:app"
